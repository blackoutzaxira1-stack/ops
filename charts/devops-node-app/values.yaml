replicaCount: 2

image:
  repository: zaxira/devops-node-app
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "public"
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: devops-app.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  NODE_ENV: production
  LOG_LEVEL: info

# Database Configuration
postgresql:
  enabled: true
  auth:
    database: devops_db
    username: devops_user
    password: devops_password
  primary:
    persistence:
      enabled: false # Set to true for production

# Monitoring
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s
  labels:
    release: monitoring
